<div class="container">
  <h2>{{ isEditMode ? 'Edit' : 'Add' }} Employee</h2>
  
  <form (ngSubmit)="saveEmployee()">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" name="name" [(ngModel)]="employee.name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" [(ngModel)]="employee.email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Position</label>
      <input type="text" class="form-control" name="position" [(ngModel)]="employee.position">
    </div>
    <div class="mb-3">
      <label class="form-label">Salary</label>
      <input type="number" class="form-control" name="salary" [(ngModel)]="employee.salary">
    </div>
    
    <button type="submit" class="btn btn-success me-2">Save</button>
    <button type="button" class="btn btn-secondary" [routerLink]="['/']">Cancel</button>
  </form>
</div>
