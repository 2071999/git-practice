<div class="container">
  <h2>Employee List</h2>
  <button class="btn btn-primary mb-3" [routerLink]="['/add']">Add New Employee</button>
  
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Position</th>
        <th>Salary</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let employee of employees">
        <td>{{ employee.name }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.position }}</td>
        <td>{{ employee.salary | currency }}</td>
        <td>
          <button class="btn btn-sm btn-info me-2" [routerLink]="['/edit', employee.id]">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteEmployee(employee.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
